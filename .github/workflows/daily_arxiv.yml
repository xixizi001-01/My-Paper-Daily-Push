name: Daily Flexible Sensor Journal Digest

on:
  schedule:
    # Run at 01:23 UTC daily (09:23 Beijing Time), away from peak scheduling minutes.
    - cron: '23 1 * * *'
  
  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ♻️ Restore sent-paper history
        uses: actions/cache/restore@v4
        with:
          path: .paper_history
          key: paper-history-${{ github.run_id }}
          restore-keys: |
            paper-history-
      
      # 2. Setup Python environment
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. Run the paper digest script
      - name: 🚀 Run Paper Digest Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
        run: |
          python fetch_papers.py

      - name: 💾 Save sent-paper history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .paper_history
          key: paper-history-${{ github.run_id }}
